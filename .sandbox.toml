# OpenSandbox Server 配置 — cmd-exec-mcp 用（Windows / Docker Desktop）
#
# 用法：
#   opensandbox-server --config .sandbox.toml
#   或设置环境变量：$env:SANDBOX_CONFIG_PATH = "D:\CodeFile\cmd-exec-mcp\.sandbox.toml"
#
# 前置条件：Docker Desktop 已安装并运行

[server]
host = "127.0.0.1"
port = 8080
# api_key 留空：本地开发，启动时输入 YES 确认即可
# 生产环境务必设置 api_key
api_key = "cmd-exec-mcp-dev"

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:v1.0.21"

[docker]
# Windows Docker Desktop 只能用 bridge，host 模式无效
network_mode = "bridge"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096

[store]
type = "sqlite"
path = "~/.opensandbox/opensandbox.db"

[storage]
# 空白名单 = 拒绝所有宿主机挂载（安全）
allowed_host_paths = []